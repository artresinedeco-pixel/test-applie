name: Compilation iOS
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Installer XcodeGen
        run: brew install xcodegen
      - name: Générer le projet Xcode
        run: xcodegen generate
      - name: Compiler pour simulateur iPhone (sans signature)
        run: |
          xcodebuild -project ObdFiat500.xcodeproj \
            -scheme ObdFiat500 \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            build > "$GITHUB_WORKSPACE/build.log" 2>&1
          code=$?
          grep -E "error:|warning: " "$GITHUB_WORKSPACE/build.log" | head -15 | sed 's/^/::error::/' || true
          if [ $code -ne 0 ]; then tail -20 "$GITHUB_WORKSPACE/build.log" | sed 's/^/::error::/'; fi
          exit $code
      - name: Sauvegarder le journal
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: journal-compilation
          path: build.log
          if-no-files-found: warn
